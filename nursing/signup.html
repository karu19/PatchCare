<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Create account | PatchCare</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <div id="site-header"></div>
    <main class="auth-wrap">
        <form class="auth-card" id="signup-form"><span class="eyebrow">JOIN PATCHCARE</span>
            <h1>Create account</h1>
            <p>Set up a local demo profile.</p><label>Full name<input name="name" required></label><label>Email
                address<input name="email" type="email" required></label><label>Username<input name="username"
                    required></label><label>Password<input name="password" type="password" minlength="6"
                    required></label><label>Confirm password<input name="confirm" type="password" minlength="6"
                    required></label><button class="btn full-width" type="submit">Create account</button>
            <p class="auth-foot">Already registered? <a href="login.html">Log in</a></p><small class="notice">Demo only:
                account details are stored in this browser and are not securely authenticated.</small>
        </form>
    </main>
    <div id="site-footer"></div>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
